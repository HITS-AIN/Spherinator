name: Release

on:
  push:
    tags:
      # Publish on any tag starting with a `v`, e.g. v1.2.3
      - v*

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Environment and permissions trusted publishing.
    environment:
      # Create this environment in the GitHub repository under Settings -> Environments
      name: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Verify tag matches package version
        run: python -c "import os, tomllib; expected='v' + tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; actual=os.environ['GITHUB_REF_NAME']; assert actual == expected, f'{actual} does not match {expected}'"
      - name: Run tests
        run: uv run --extra dev -p 3.12 pytest
      - run: uv build
      - name: Publish to TestPyPI
        if: github.repository != 'HITS-AIN/Spherinator'
        run: uv publish --trusted-publishing always --index testpypi
      - name: Publish to PyPI
        if: github.repository == 'HITS-AIN/Spherinator'
        run: uv publish --trusted-publishing always
