# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 0.7.8
          checksum: "285981409c746508c1fd125f66a1ea654e487bf1e4d9f45371a062338f788adb"
          enable-cache: true

      # Keep the ruff version in sync with .pre-commit-config.yaml
      - name: Check code linting
        run: uvx ruff@0.16.10 check --no-fix

      - name: Check code formatting
        run: uvx ruff@0.16.10 format --check

  test:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: 'recursive'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: python --version

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 0.7.8
          checksum: "285981409c746508c1fd125f66a1ea654e487bf1e4d9f45371a062338f788adb"
          enable-cache: true

      - run: uv --version
      - run: uv run python --version

      - name: Run unit tests
        run: uv run --extra dev -p ${{ matrix.python-version }} pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 0.7.8
          checksum: "285981409c746508c1fd125f66a1ea654e487bf1e4d9f45371a062338f788adb"
          enable-cache: true
      - run: uv run --extra docs -p 3.12 sphinx-build -W -b html docs docs/_build/html
